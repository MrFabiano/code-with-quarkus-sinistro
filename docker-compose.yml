services:
  postgres:
    image: postgres:16
    container_name: seguros-db
    environment:
      POSTGRES_USER: quarkus
      POSTGRES_PASSWORD: quarkus
      POSTGRES_DB: seguros_db
    ports:
      - "5432:5432"
    networks:
      - seguros-network

  pgadmin:
    image: dpage/pgadmin4:9.5
    container_name: seguros-pgadmin
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: fabiannosanttos@gmail.com
      PGADMIN_DEFAULT_PASSWORD: postgres
    ports:
      - "5051:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - seguros-network

  seguros-api:
   image: seguros/sinistro-api:1.0.0
   build:
    context: .
    dockerfile: src/main/docker/Dockerfile.jvm
   container_name: seguros-api
   environment:
      APP_SIMULAR_FALHA: "false"
      QUARKUS_PROFILE: prod
      QUARKUS_DATASOURCE_USERNAME: quarkus
      QUARKUS_DATASOURCE_PASSWORD: quarkus
      QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      QUARKUS_OTEL_TRACES_SAMPLER: always_on
   ports:
    - "8080:8080"
   depends_on:
    - postgres
    - kafka
    - keycloak
    - jaeger
   networks:
    - seguros-network
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: seguros-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    networks:
      - seguros-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: seguros-kafka-ui
    ports:
      - "8082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - seguros-network

  # === JAAGER (NOVO) ===
  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: jaeger
    ports:
      - "16686:16686"    # UI do Jaeger
      - "4317:4317"      # OTLP gRPC
      - "4318:4318"      # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - seguros-network

  # === PROMETHEUS (NOVO) ===
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - seguros-network

  # === GRAFANA (NOVO) ===
  grafana:
    image: grafana/grafana:10.1.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - seguros-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: seguros-auth
    command: start-dev --http-relative-path /auth
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
    networks:
      - seguros-network

networks:
  seguros-network:
    name: seguros-network
    driver: bridge

volumes:
  keycloak-data:
  pgadmin-data:
  grafana-data: