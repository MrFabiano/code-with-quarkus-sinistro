apiVersion: apps/v1
kind: Deployment
metadata:
  name: seguros-db
  namespace: seguros
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seguros-db
  template:
    metadata:
      labels:
        app: seguros-db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: seguros-secrets
                  key: db-username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seguros-secrets
                  key: db-password
            - name: POSTGRES_DB
              value: seguros_db
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: seguros-db
  namespace: seguros
spec:
  selector:
    app: seguros-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: seguros
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi