apiVersion: apps/v1
kind: Deployment
metadata:
  name: sinistro-api
  namespace: seguros
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sinistro-api
  template:
    metadata:
      labels:
        app: sinistro-api
    spec:
      containers:
        - name: sinistro-api
          image: seguros/sinistro-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: QUARKUS_PROFILE
              value: prod
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "seguros-kafka:9092"
            - name: QUARKUS_KAFKA_BOOTSTRAP_SERVERS
              value: "seguros-kafka:9092"
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: seguros-secrets
                  key: db-username
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seguros-secrets
                  key: db-password
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: sinistro-api
  namespace: seguros
spec:
  selector:
    app: sinistro-api
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP