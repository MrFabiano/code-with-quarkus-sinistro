# Pode remover ou manter apenas assim:
app.simular-falha=${APP_SIMULAR_FALHA:false}

%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/seguros_db
%dev.quarkus.oidc.auth-server-url=http://localhost:8180/auth/realms/seguros
%dev.kafka.bootstrap.servers=localhost:9092
%dev.quarkus.otel.exporter.otlp.endpoint=http://localhost:4317
%dev.quarkus.otel.sdk.disabled=true

# Liga o handler ao consumer
mp.messaging.incoming.seguros-sinistros-in.deserialization-failure-handler=sinistroDeserializationFailureHandler

# Habilita validação Bean
#quarkus.arc.validator.enabled=true

# Retorna 400 em vez de 500 para violações de validação
#quarkus.resteasy.validation.throw-exception=true

# ==========================================
# Configurações Globais (Afeta todos os perfis)
# ==========================================
# COMUM (todos os perfis)
# ==========================================
# 1. Configurações Globais (Obrigatórias para todos)
quarkus.virtual-threads.enabled=true
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:quarkus}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:quarkus}
quarkus.hibernate-orm.database.generation=update
quarkus.oidc.client-id=sinistro-service
quarkus.oidc.discovery-enabled=true
#quarkus.oidc.tls.trust-all=true

# 3. Configurações Específicas de PROD (%prod.)
#%prod.quarkus.otel.exporter.otlp.traces.enabled=false

# 4. Mensageria (Comum a todos)
mp.messaging.outgoing.seguros-sinistros-out.connector=smallrye-kafka
mp.messaging.outgoing.seguros-sinistros-out.topic=seguros.sinistros.events
mp.messaging.incoming.seguros-sinistros-in.auto.offset.reset=earliest
mp.messaging.outgoing.seguros-sinistros-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

#mp.messaging.incoming.seguros-sinistros-in.topic=seguros.sinistros.events
#mp.messaging.incoming.seguros-sinistros-in.value.deserializer=org.acme.resource.seguros.sinistro.adapter.out.messaging.SinistroEventDeserializer
#mp.messaging.incoming.seguros-sinistros-in.failure-strategy=dead-letter-queue
#mp.messaging.incoming.seguros-sinistros-in.dead-letter-queue.topic=seguros-sinistros-dlq
mp.messaging.incoming.seguros-sinistros-in.dead-letter-queue.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.incoming.seguros-sinistros-in.dead-letter-queue.key.serializer=org.apache.kafka.common.serialization.StringSerializer
# Canal de entrada
mp.messaging.incoming.seguros-sinistros-in.topic=seguros.sinistros.events
mp.messaging.incoming.seguros-sinistros-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Mantém a estratégia de DLQ para quando lançar exceção no código
mp.messaging.incoming.seguros-sinistros-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.seguros-sinistros-in.dead-letter-queue.topic=seguros-sinistros-dlq
#mp.messaging.incoming.seguros-sinistros-in.enable.auto.commit=false

# ==========================================
# PROD (Docker Compose e Kubernetes)
# ==========================================
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://seguros-db:5432/seguros_db
%prod.quarkus.oidc.auth-server-url=http://seguros-auth:8080/auth/realms/seguros
%prod.kafka.bootstrap.servers=kafka:29092
%prod.quarkus.otel.exporter.otlp.endpoint=http://seguros-jaeger:4317
%prod.quarkus.oidc.token.issuer=http://localhost:8180/auth/realms/seguros
quarkus.otel.exporter.otlp.traces.enabled=false

# ==========================================
# CONTAINER IMAGE
# ==========================================
quarkus.container-image.group=seguros
quarkus.container-image.name=sinistro-api
quarkus.container-image.tag=1.0.0
quarkus.container-image.builder=jib

# ==========================================
# KUBERNETES
# ==========================================
quarkus.kubernetes.namespace=seguros
quarkus.kubernetes.replicas=2
quarkus.kubernetes.service-type=ClusterIP
quarkus.kubernetes.liveness-probe.http-action-path=/q/health/live
quarkus.kubernetes.readiness-probe.http-action-path=/q/health/ready
quarkus.kubernetes.resources.requests.memory=256Mi
quarkus.kubernetes.resources.requests.cpu=250m
quarkus.kubernetes.resources.limits.memory=512Mi
quarkus.kubernetes.resources.limits.cpu=500m

# ==========================================
# HEALTH CHECKS
# ==========================================
quarkus.smallrye-health.enabled=true
quarkus.smallrye-health.liveness.path=/q/health/live
quarkus.smallrye-health.readiness.path=/q/health/ready
quarkus.smallrye-health.startup.path=/q/health/started
quarkus.smallrye-health.show-details=always

# Health do Kafka habilitado
mp.messaging.outgoing.seguros-sinistros-out.health.enabled=true
mp.messaging.incoming.seguros-sinistros-in.health.enabled=true

# Health do Database (Hibernate)
quarkus.hibernate-orm.health.enabled=true

# ==========================================
# LOGGING ESTRUTURADO
# ==========================================
quarkus.log.level=INFO
quarkus.log.category."org.acme".level=INFO
quarkus.log.console.json=false
quarkus.log.file.enable=true
quarkus.log.file.path=logs/app.log

# Format com trace ID
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%X{trace-id},%X{span-id}] [%thread] %c{2.} - %m%n
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%X{trace-id},%X{span-id}] [%thread] %c{2.} - %m%n

# Adicione trace/span ID nos headers da resposta
quarkus.vertx.http.response-header-tracing.enabled=true


# ==========================================
# OPENTELEMETRY / TRACING
# ==========================================
quarkus.opentelemetry.tracer.exporter.otlp.endpoint=http://jaeger:4317
quarkus.opentelemetry.tracer.resource-attributes.service.name=seguros-api
quarkus.opentelemetry.tracer.sampling-parent-probability=1.0
quarkus.opentelemetry.tracer.sampling-rate=1.0

# Habilita tracing no Kafka
quarkus.kafka.tracing.enabled=true
quarkus.smallrye-messaging.tracing.enabled=true

# ==========================================
# MICROMETER - MÉTRICAS PROMETHEUS
# ==========================================
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/prometheus

# Binders padrão (opcional, mas útil)
quarkus.micrometer.binder.jvm.enabled=true
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.system.enabled=true

# REST Client - Camel Router
quarkus.rest-client.camel-router.url=http://localhost:8081

# Para o ambiente Docker (%prod)
%prod.quarkus.rest-client.camel-router.url=http://seguros-camel-router:8081

# Desabilita conversão automática de tipos
quarkus.resteasy.validation.throw-exception=true